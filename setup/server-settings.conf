# AzerothCore server settings - portable record
# Generated by setup\export-settings.ps1 on 2026-07-31 18:12
#
# Every line below is a setting that DIFFERS from the shipped .conf.dist.
# Apply to a fresh install with:   setup\apply-settings.ps1 -FromDist
#
# Placeholders substituted at apply time:
#   {{BASE}}     -> the wow\ folder, derived from this script's own location
#   {{DB_PASS}}  -> read from setup\db-password.txt
#
# NO SECRETS IN THIS FILE. It is committed to a public repo.

[worldserver.conf]
LoginDatabaseInfo = "127.0.0.1;3306;acore;{{DB_PASS}};acore_auth"
WorldDatabaseInfo = "127.0.0.1;3306;acore;{{DB_PASS}};acore_world"
CharacterDatabaseInfo = "127.0.0.1;3306;acore;{{DB_PASS}};acore_characters"
# absolute path to extracted client data (dbc/maps/vmaps/mmaps)
DataDir = "{{BASE}}/server/Data"
# a NON-EXISTENT LogsDir silently disables file logging entirely
LogsDir = "{{BASE}}/server/logs"
# NOT cosmetic - playerbots module SQL is resolved through it on every boot
SourceDirectory = "{{BASE}}/source"
Network.Threads = 2
# BOOL. dist ships 1 (high), which starves MySQL on the same box
ProcessPriority = 0
# raised while debugging ICC gunship spell visibility
Logger.spells.scripts = 5,Console Server Errors
# raised while debugging ICC gunship spell visibility
# NOT A STOCK OPTION - requires the source patch to be applied first.
Logger.entities.vehicle = 5,Console Server
# raised while debugging ICC gunship spell visibility
# NOT A STOCK OPTION - requires the source patch to be applied first.
Logger.vehicles = 5,Console Server
# benchmarked on 12 threads; raise only with evidence
MapUpdate.Threads = 6
# progression rate
Rate.XP.Kill = 3
# progression rate
Rate.XP.Quest = 7
# progression rate
Rate.Drop.Money = 2
# 7 = RDF enabled for both random and specific dungeons
DungeonFinder.OptionsMask = 7

[authserver.conf]
# a NON-EXISTENT LogsDir silently disables file logging entirely
LogsDir = "{{BASE}}/server/logs"
LoginDatabaseInfo = "127.0.0.1;3306;acore;{{DB_PASS}};acore_auth"

[modules/playerbots.conf]
# sized for 16 GB / 12 threads. Accounts = ceil(max/10) + PoolSize
AiPlayerbot.MinRandomBots = 250
# keep equal to Min unless you want churn
AiPlayerbot.MaxRandomBots = 250
# adds directly to the account count - dist 50 is why stock boot appears to hang
AiPlayerbot.AddClassAccountPoolSize = 5
# ADDED BY PATCH 001 - not a stock option. Bots wait before acting on dungeon entry
# NOT A STOCK OPTION - requires the source patch to be applied first.
AiPlayerbot.LfgEnterDelayMin = 25000
# ADDED BY PATCH 001 - not a stock option
# NOT A STOCK OPTION - requires the source patch to be applied first.
AiPlayerbot.LfgEnterDelayMax = 50000
AiPlayerbot.SummonWhenGroup = 0
AiPlayerbot.AllowSummonInCombat = 0
AiPlayerbot.ReactDelay = 350
AiPlayerbot.FollowDistance = 4.5
# CRITICAL: with 0 every bot password EQUALS its account name. Consulted only at creation - set before any bot exists
AiPlayerbot.RandomBotRandomPassword = 1
# bots spawn at 80 so they can fill level-80 raids and RDF
AiPlayerbot.RandomBotMinLevel = 80
# percent of bots active with no real player nearby - raised so the world feels alive
AiPlayerbot.BotActiveAlone = 50
# +pull makes the TANK open combat instead of waiting for a command; -dps assist lets bots pick their own targets
AiPlayerbot.RandomBotCombatStrategies = "+pull,+attack tagged,-dps assist"
# same, for non-random bots
AiPlayerbot.CombatStrategies = "+pull,+attack tagged,-dps assist"
PlayerbotsDatabaseInfo = "127.0.0.1;3306;acore;{{DB_PASS}};acore_playerbots"
# how often bots re-roll activity; raised so they move around instead of idling
AiPlayerbot.RandomChangeMultiplier = 3
# 0 = stop bots whispering real players
AiPlayerbot.RandomBotTalk = 0
# 0 = stop dungeon-suggestion whispers
AiPlayerbot.RandomBotSuggestDungeons = 0

[modules/mod_ahbot.conf]
# mod-ah-bot - пълни аукциона, за да има икономика преди сървърът да се напълни.
# Модулът е в setup\modules.txt; изисква ново построяване, не само настройка.
# 1 = ботът обявява предмети за продан
AuctionHouseBot.EnableSeller = 1
# 1 = ботът наддава по чужди обяви, иначе играчите нямат на кого да продават
AuctionHouseBot.EnableBuyer = 1
# Собственикът на обявите. Създава се от setup\sql\ - акаунт AHBOT, герой Aukcioner.
# Числата са заковани нарочно, за да сочат към същия ред на всяка машина.
AuctionHouseBot.Account = 900
AuctionHouseBot.GUID = 900000
# Брои само своите обяви, не и на играчите - иначе, щом играчите напълнят пазара,
# ботът спира да обявява и фонът изчезва точно когато има кой да го види.
AuctionHouseBot.ConsiderOnlyBotAuctions = 1
# Купчини по разумни размери (5/10/15/20), вместо случайни бройки.
AuctionHouseBot.DivisibleStacks = 1
